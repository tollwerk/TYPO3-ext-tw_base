<f:argument name="items" type="array" description="Facts, each with &quot;label&quot; and &quot;value&quot;" />
<dl class="MailFacts">
    <f:for each="{items}" as="item">
        <dt class="MailFacts__label">{item.label}</dt>
        <dd class="MailFacts__value">{item.value}</dd>
    </f:for>
</dl>
