<f:argument name="sender" type="string" description="Who sends the mail, such as the name and address of the organisation" />
<f:argument name="links" type="array" optional="1" default="{}" description="Links such as contact and legal notice, each with &quot;label&quot; and &quot;href&quot;" />
<f:comment>The slot "reason" says in one sentence why the person gets the mail, as HTML that may have links.</f:comment>
<div class="MailFooter">
    <f:if condition="{f:slot(name: 'reason') -> f:format.trim()}"><p class="MailFooter__line"><f:slot name="reason" /></p></f:if>
    <p class="MailFooter__line">{sender}</p>
    <f:for each="{links}" as="link"><p class="MailFooter__item"><a class="MailFooter__link" href="{link.href}">{link.label}</a></p></f:for>
</div>
